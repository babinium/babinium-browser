name: Compilar Debian 13 amd64
run-name: Debian13 / ${{ inputs.solicitud }}
on:
  workflow_dispatch:
    inputs:
      solicitud:
        description: Identificador de esta compilación
        required: true
        type: string
permissions:
  contents: read
jobs:
  compilar:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    container:
      image: debian:13-slim
      # WebKit's bubblewrap sandbox needs namespace creation inside Docker.
      options: --cap-add=SYS_ADMIN --security-opt seccomp=unconfined --security-opt apparmor=unconfined
    defaults:
      run:
        shell: bash
    env:
      DEBIAN_FRONTEND: noninteractive
      CFLAGS: -O2 -march=x86-64 -mtune=generic
      RUSTFLAGS: -C target-cpu=x86-64
      CARGO_BUILD_JOBS: 2
    steps:
      - name: Dependencias Debian
        run: |
          echo 'deb http://deb.debian.org/debian trixie-backports main' > /etc/apt/sources.list.d/backports.list
          apt-get update
          apt-get install -y --no-install-recommends ca-certificates git build-essential pkg-config file binutils libwebkit2gtk-4.1-dev libgtk-3-dev libjson-glib-dev nodejs python3 xvfb xauth dbus-x11 xdotool
          apt-get install -y --no-install-recommends -t trixie-backports cargo rustc
      - name: Código
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Recuperar compilación Rust
        id: rust-cache
        uses: actions/cache/restore@caa296126883cff596d87d8935842f9db880ef25
        with:
          path: blocker/target
          key: debian13-rust196-baseline-${{ hashFiles('blocker/Cargo.lock', 'blocker/Cargo.toml') }}
      - name: Compilar y validar
        run: bash .github/scripts/compilar-debian.sh
      - name: Conservar compilación Rust
        if: always() && steps.rust-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@caa296126883cff596d87d8935842f9db880ef25
        with:
          path: blocker/target
          key: debian13-rust196-baseline-${{ hashFiles('blocker/Cargo.lock', 'blocker/Cargo.toml') }}
      - name: Preparar entrega
        run: |
          mkdir -p entrega
          tar -czf entrega/programas.tar.gz -C artifacts .
          cp artifacts/entorno.txt entrega/
          cd entrega
          sha256sum programas.tar.gz entorno.txt > SHA256SUMS
      - name: Artefactos
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: debian13-amd64
          path: entrega/
          if-no-files-found: error
          retention-days: 3
      - name: Diagnóstico de compilación fallida
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: debug-build
          path: |
            build/bin/
            build/lib/
            build/share/
            artifacts/
            blocker/Cargo.lock
          if-no-files-found: ignore
          retention-days: 1
