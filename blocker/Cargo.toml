[package]
name = "babinium-blocker"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
license = "GPL-3.0-or-later"

[lib]
crate-type = ["staticlib", "rlib"]

[[bin]]
name = "babinium-filter"
path = "src/main.rs"

[dependencies]
adblock = { version = "=0.13.3", features = ["resource-assembler"] }
serde_json = "1.0"

[profile.release]
opt-level = 2
lto = "thin"
codegen-units = 1
strip = true
